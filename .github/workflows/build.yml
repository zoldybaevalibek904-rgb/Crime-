name: Build Java ME
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: tools/build.sh
      - run: tools/test-model.sh
      - uses: actions/upload-artifact@v4
        with:
          name: crime-district-alpha05
          path: |
            dist/CrimeDistrict_Alpha05.jar
            dist/CrimeDistrict_Alpha05.jad
          if-no-files-found: error
